services:
  api:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      database_url: sqlite:////data/villagebank.db
    volumes:
      - api-data:/data

  web:
    build:
      context: ./client
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api-data:

