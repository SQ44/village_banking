services:
  lenco_pay:
    build:
      context: ./lenco_pay
    ports:
      - "8001:8000"
    env_file:
      - ./lenco_pay/.env.example
      - ./lenco_pay/.env
    environment:
      database_url: sqlite:////data/lenco_pay.db
    volumes:
      - lenco-data:/data

  api:
    build:
      context: ./server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env.example
      - ./server/.env
    environment:
      database_url: sqlite:////data/villagebank.db
      lenco_pay_base: http://lenco_pay:8000/api/v1
    volumes:
      - api-data:/data
    depends_on:
      - lenco_pay

  web:
    build:
      context: ./client
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api-data:
  lenco-data:
